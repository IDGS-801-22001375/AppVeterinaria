<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/auth/styles/login.css">
    <title>Iniciar sesión</title>
</head>
<body>
    <main class="container">
        <section class="login-form" aria-labelledby="login-title">
            <header class="login-header">
                <h1 id="login-title">Iniciar Sesión</h1>
                <p>Ingresa tus dog credenciales para acceder</p>
            </header>
            <form class="form-container" action="/login" method="POST">
                <div class="form-field">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
                </div>
                <div class="form-field">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit">Iniciar Sesión</button>
            </form>

            <div class="register-link">
                <p>¿No tienes una cuenta? <a href="/auth/register.html">Regístrate aquí</a></p>
            </div>
        </section>
    </main>
</body>
</html>
