<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/auth/styles/login.css">
    <link rel="stylesheet" href="/auth/styles/register.css">
    <title>Crear cuenta</title>
    <script src="/auth/js/validation.js?v=1" defer></script>
    <script src="/auth/js/auth.js?v=4" defer></script>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#007c83">
    <link rel="stylesheet" href="/pwa/pwa.css">
    <script src="/pwa/offline.js?v=2"></script>
    <script src="/pwa/local-auth.js?v=1"></script>
    <script src="/pwa/register.js" defer></script>
</head>
<body>
    <main class="container">
        <section class="login-form register-form" aria-labelledby="register-title">
            <header class="login-header">
                <h1 id="register-title">Crear cuenta</h1>
                <p>Ingresa tus datos para registrarte</p>
            </header>
            <p class="auth-message" id="auth-message" role="status" aria-live="polite">Cargando formulario… Si el botón no se habilita, no se pudo cargar el script de registro.</p>
            <noscript>Activa JavaScript para registrar tu cuenta.</noscript>
            <form class="form-container register-fields" data-auth="register" action="/api/auth/registro" method="POST" novalidate>
                <div class="form-field">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" maxlength="80" autocomplete="given-name" required>
                </div>
                <div class="form-field">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" name="apellido" maxlength="80" autocomplete="family-name" required>
                </div>
                <div class="form-field">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" minlength="8" aria-describedby="password-help" autocomplete="new-password" required>
                    <small id="password-help">Mínimo 8 caracteres. Máximo 72 bytes.</small>
                </div>
                <div class="form-field">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" maxlength="150" autocomplete="email" autocapitalize="none" spellcheck="false" required>
                </div>
                <div class="form-field">
                    <label for="phone">Teléfono</label>
                    <input type="tel" id="phone" name="telefono" maxlength="30" autocomplete="tel">
                </div>
                <button type="submit" disabled>Registrarse</button>
            </form>
            <div class="login-link">
                <p>¿Ya tienes una cuenta? <a href="/auth/login.html">Inicia sesión aquí</a></p>
            </div>
        </section>
    </main>
</body>
</html>
